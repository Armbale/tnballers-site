# Netlify publishes only the finished site. The build is done before each commit (src/build.sh),
# so Netlify has nothing to build.
[build]
  publish = "site"
  command = ""

# Security headers for every served path.
# CSP policy:
#   - All scripts, styles, fonts and images come from this origin (self-hosted).
#   - 'unsafe-inline' is allowed on style-src and script-src because the build inlines them
#     into site/index.html for performance; no third-party JS or CSS is ever loaded.
#   - img-src also allows data: for small inline SVGs (icons).
#   - connect-src 'self' blocks any cross-origin fetch/XHR/WebSocket.
#   - form-action 'self' is enough for Netlify Forms (same-origin POST).
#   - frame-ancestors 'none' and X-Frame-Options DENY block clickjacking.
#   - object-src 'none' blocks Flash/legacy plugins.
# HSTS: 2 years, no preload (preload is a one-way commitment we don't want yet).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

# Long-cache the self-hosted fonts (immutable file names).
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /templates/ holds Baller's Canva-reference HTML files that use Google Fonts
# (Bebas Neue / Barlow Condensed). They're not part of the live visitor flow, but
# they need to render for Baller's own reference, so widen style-src and font-src
# just for that path. Everything else on the site stays strict.
[[headers]]
  for = "/templates/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
