    if(id==='gk'){animateFigure(f,0,at,false); const d=f.userData.dive||0; f.userData.body.rotation.z=d; f.userData.body.position.y=Math.abs(d)*.4; const B=f.userData.bones; if(B.LeftArm&&d){B.LeftArm.rotation.z+=1.8*Math.abs(d)/1.25; B.RightArm.rotation.z-=1.8*Math.abs(d)/1.25;}}
    if(id!=='gk') animateFigure(f,vel,at,run, id==='scorer'&&at>T.shot0-.25&&at<T.shot0+.35 ? (at-(T.shot0-.25))/.6 : 0);
    if(f.userData.ring){f.userData.ring.scale.setScalar(1+.15*Math.sin(t*6));}
  }
  // celebrate
  if(at>T.goal+.3){const f=players.scorer.f; f.position.y=Math.abs(Math.sin((at-T.goal)*5))*.45; const B=f.userData.bones; if(B.LeftArm){B.LeftArm.rotation.set(0,0,2.6); B.RightArm.rotation.set(0,0,-2.6); B.LeftForeArm.rotation.set(0,0,0); B.RightForeArm.rotation.set(0,0,0);}}
  // ball, trail, net ripple
  const bp=ballPos(at); ball.position.copy(bp); ball.rotation.x+=.3; glow.position.copy(bp);
  hist.push(bp.clone()); while(hist.length>TRAIL) hist.shift();
  const arr=trailGeo.attributes.position.array; for(let i=0;i<TRAIL;i++){const q=hist[Math.max(0,hist.length-TRAIL+i)]||bp; arr[i*3]=q.x;arr[i*3+1]=q.y;arr[i*3+2]=q.z;} trailGeo.attributes.position.needsUpdate=true;
  trail.visible=at>T.pass0;
  const na=netGeo.attributes.position.array; const rip=at>T.shot1?Math.exp(-(at-T.shot1)*2.5):0; const hx=P(...S.shot[1]).x;
  for(let i=0;i<na.length;i+=3){const dx=net0[i]-hx, dy=net0[i+1]-(S.shot_height-1.22); const d=Math.sqrt(dx*dx+dy*dy); na[i+2]=net0[i+2]+rip*1.4*Math.exp(-d*d*.6)*Math.cos(d*5-(at-T.shot1)*14);} netGeo.attributes.position.needsUpdate=true;
  // camera (+ shake on the goal)
  const [cp,cl,camName]=camAt(t,at); cam.position.copy(cp); if(t>T.goal_wall&&t<T.goal_wall+.5){const s=(T.goal_wall+.5-t)*.5; cam.position.x+=Math.sin(t*90)*s; cam.position.y+=Math.cos(t*77)*s;}
  cam.lookAt(cl); cam.fov=camAt(t,at)[3]||42; cam.updateProjectionMatrix();
  r.render(sc,cam);
  // overlays
  let h='<div class="bar t"></div><div class="bar b"></div>';
  if(t<T.hook){const o=t<T.hook-.35?1:(T.hook-t)/.35; h+=`<div class="hook" style="opacity:${o}"><img src="player.png"><div class="txt"><div class="k">⚽ GOAL ${S.minute} · ${S.comp.toUpperCase()}</div><div class="nm"><span>${first}</span>${last}</div><div class="vs"><span class="t">${S.home}</span><span class="sc">${S.score_after}</span><span class="t">${S.away}</span></div></div></div>`;}
  else {
    h+=`<div class="tag"><i></i>${S.minute} · ${last.toUpperCase()} vs ${S.away.toUpperCase()}</div>`;
    if(camName && t<T.end_wall) h+=`<div class="cam">${camName}</div>`;
    const bi=S.beats.findIndex((b,i)=>t>=b[0]&&(i==S.beats.length-1||t<S.beats[i+1][0]));
    if(bi>=0 && t<T.end_wall) h+=`<div class="beat"><b>${bi+1}</b>${S.beats[bi][1]}</div>`;
    if(t>sm[0]&&t<sm[1]) h+='<div class="speed"></div>';
  }
  if(t>T.goal_wall&&t<T.goal_wall+.12) h+=`<div class="flash" style="opacity:${1-(t-T.goal_wall)/.12}"></div>`;
  if(t>T.goal_wall&&t<T.end_wall){const k=clamp((t-T.goal_wall)/.35); const sc_=lerp(2.2,1,eout(k)); h+=`<div class="goal" style="transform:scale(${sc_});opacity:${k}">GOAL</div>`;}
  if(t>=T.end_wall){const k=clamp((t-T.end_wall)/.5); h+=`<div class="endc" style="opacity:${k}"><div class="box"><div class="k">${S.comp.toUpperCase()} · ${S.minute}</div><div class="nm"><span>${first}</span>${last}</div><div class="ln">${S.end_line}</div></div></div>`;}
  h+=`<div class="foot"><span class="c">${S.source_note} · 📸 ${S.credit}</span><span class="r">TNBALLERS.COM</span></div>`;
  ov.innerHTML=h;
};
window.ready=true;
window.renderAt=renderAt;
</script></body></html>
