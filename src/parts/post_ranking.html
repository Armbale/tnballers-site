<!doctype html>
<!-- TNB ranking post template. Rendered by src/tools/ranking_post.py; %%BODY%% is filled from BEST in make_canada.py. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tanker;src:url(%%FONTS%%/tanker/Tanker-Regular.woff2) format('woff2')}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Semibold.woff2) format('woff2');font-weight:600}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Bold.woff2) format('woff2');font-weight:700}
:root{--red:#d40f1f;--red2:#8a0712;--gold:#f0c255;--ink:#0a0a0b;--paper:#f4efe6}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;background:var(--ink);overflow:hidden}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Switzer,sans-serif;color:#fff;
  background:
   radial-gradient(700px 560px at 790px 470px, rgba(212,15,31,.55), transparent 70%),
   radial-gradient(900px 500px at 120px 1250px, rgba(240,194,85,.08), transparent 70%),
   linear-gradient(180deg,#121214 0%,#0a0a0b 60%,#070708 100%)}
/* diagonal stripes */
.stripe{position:absolute;width:150px;height:2200px;background:linear-gradient(180deg,var(--red),var(--red2));transform:rotate(28deg);top:-400px;left:820px;opacity:.9}
.stripe.thin{width:14px;left:1000px;background:var(--gold);opacity:.75}
/* grain */
.grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* header */
.kicker{position:absolute;top:58px;left:64px;font-weight:700;font-size:20px;letter-spacing:.32em;color:var(--gold);display:flex;align-items:center;gap:14px}
.kicker i{display:block;width:44px;height:3px;background:var(--gold)}
.title{position:absolute;top:92px;left:58px;font-family:Tanker;font-size:132px;line-height:.86;letter-spacing:.005em;text-transform:uppercase}
.title .out{color:transparent;-webkit-text-stroke:2.5px var(--red);display:block}
/* hero */
.big1{position:absolute;top:170px;left:745px;font-family:Tanker;font-size:760px;line-height:.8;background:linear-gradient(180deg,rgba(240,194,85,.55),rgba(240,194,85,0) 85%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-img{position:absolute;top:150px;left:470px;width:600px;height:640px;overflow:hidden;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent 99%)}
.hero-img img{position:absolute;left:-10px;top:0;width:620px}
.hero-txt{position:absolute;top:356px;left:64px;width:470px}
.badge{display:inline-flex;align-items:center;gap:10px;background:var(--gold);color:#111;font-weight:700;font-size:19px;letter-spacing:.18em;padding:9px 16px 8px;text-transform:uppercase}
.badge b{font-size:16px}
.hero-name{font-family:Tanker;font-size:104px;line-height:.86;text-transform:uppercase;margin-top:18px;text-shadow:0 6px 30px rgba(0,0,0,.6)}
.hero-club{font-weight:700;font-size:21px;letter-spacing:.28em;color:var(--gold);margin-top:14px;text-transform:uppercase}
.chips{display:flex;gap:10px;margin-top:16px}
.chip{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.18);padding:10px 14px 9px;min-width:104px;backdrop-filter:blur(4px)}
.chip .n{font-family:Tanker;font-size:46px;line-height:.9}
.chip .l{font-weight:700;font-size:13px;letter-spacing:.22em;color:#bdbdbd;margin-top:4px}
.chip.hot{border-color:var(--red);background:rgba(212,15,31,.22)}
.hero-line{margin-top:12px;font-size:19px;line-height:1.3;color:#e6e6e6;font-weight:600;max-width:440px}
/* grid */
.grid{position:absolute;left:44px;right:44px;top:810px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.card{position:relative;height:420px;background:linear-gradient(180deg,#232327 0%,#141416 55%,#0f0f11 100%);border-top:5px solid var(--red);overflow:hidden}
.card .num{position:absolute;top:2px;left:14px;font-family:Tanker;font-size:120px;line-height:1;color:var(--gold);z-index:3;text-shadow:0 4px 18px rgba(0,0,0,.7)}
.card .mv{position:absolute;top:18px;right:14px;z-index:3;font-weight:700;font-size:15px;letter-spacing:.12em;color:#9a9a9a}
.card .mv.dn{color:#ff5a5a}
.card .ph{position:absolute;left:0;right:0;top:22px;height:270px;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent 100%)}
.card .ph img{position:absolute;width:300px;left:50%;transform:translateX(-50%);top:0}
.card .glow{position:absolute;left:50%;top:70px;width:260px;height:260px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle,rgba(212,15,31,.45),transparent 70%)}
.card .info{position:absolute;left:16px;right:16px;bottom:16px;z-index:3}
.card .nm{font-family:Tanker;font-size:44px;line-height:.9;text-transform:uppercase}
.card .cl{font-weight:700;font-size:13px;letter-spacing:.2em;color:var(--gold);margin-top:8px;text-transform:uppercase}
.card .st{margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);display:flex;justify-content:space-between;align-items:baseline}
.card .st .a{font-family:Tanker;font-size:32px;line-height:1}
.card .st .b{font-weight:700;font-size:12px;letter-spacing:.16em;color:#a8a8a8;text-align:right}
/* footer */
.foot{position:absolute;left:44px;right:44px;bottom:30px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(240,194,85,.7);padding-top:16px}
.foot .c{font-size:14px;font-weight:600;color:#9d9d9d;letter-spacing:.04em}
.foot .r{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.24em}
.foot .r img{width:38px;height:40px}
</style></head>
<body>%%BODY%%</body></html>
