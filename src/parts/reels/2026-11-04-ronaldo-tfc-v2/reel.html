<!doctype html><html><head><meta charset="utf-8"><style>

.bg{position:absolute;inset:0}

.vig{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 45%,transparent 50%,#000c 100%)}
.prog{position:absolute;top:0;left:0;height:8px;background:var(--gold);z-index:80}
.cap{position:absolute;left:0;right:0;top:1450px;text-align:center;z-index:60}
.cap span.p{display:inline-block;background:#0b0b10e6;border:2px solid #ffffff1a;padding:18px 30px 14px;border-radius:18px;font-weight:700;font-size:56px;line-height:1.15;max-width:960px;box-shadow:0 20px 50px #000a}
.cap i{font-style:normal;color:var(--gold)}
.foot{position:absolute;left:44px;right:44px;bottom:60px;display:flex;justify-content:space-between;font-size:20px;color:#9a9aa5;font-weight:600;letter-spacing:.05em;z-index:65}
.card{position:absolute;background:#121218ee;border-radius:22px;border:2px solid #ffffff14;box-shadow:0 30px 60px #000b;padding:26px 30px}
.lab{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.16em;color:#b4b4c0;text-transform:uppercase}
.big{font-family:Tanker;line-height:.9}
.cut{position:absolute;filter:drop-shadow(0 30px 50px #000)}
.fade{-webkit-mask-image:linear-gradient(#000 62%,transparent 94%)}
.chip{display:inline-block;font-family:Tanker;font-size:44px;padding:12px 22px 6px;border-radius:12px;margin:8px}
.stamp{position:absolute;font-family:Tanker;color:var(--red);text-shadow:4px 0 #00e5ff99,-4px 0 #ff00aa99}
.photo{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(#000a,#0000 30%,#0000 55%,#000e 85%)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.beam{position:absolute;top:-300px;width:240px;height:2400px;background:linear-gradient(#ffffff40,transparent 70%);filter:blur(30px);transform-origin:top center}

  const ch=chunks.find(c=>c.includes(cur));
  return ch.map(j=>{const w=W[j];const on=j<=cur;const h=l.hi&&l.hi.includes(w);return `<span style="opacity:${on?1:.18}">${h?`<i>${w}</i>`:w}</span>`}).join(' ');

stay(t,s){const k=t-s.t0;let h=glow('#E31837aa','50%','50%')+beams(t)+sparks(t);
  h+=cut('ronaldo_tfc_concept.png','left:50%;margin-left:-440px;top:430px;height:1000px',k/.5);
  h+=`<div style="position:absolute;left:0;right:0;top:250px;text-align:center;z-index:30"><span class="chip" style="background:#24242c;opacity:${cl(k/.2)}">SEASON 1</span><span class="big" style="font-size:60px;color:var(--gold);opacity:${cl((k-.6)/.2)}"> → </span><span class="chip" style="background:var(--red);opacity:${cl((k-.8)/.2)};transform:scale(${1.4-0.4*eb((k-.8)/.3)})">SEASON 2</span></div>`;
  if(k>1.9)h+=`<div class="stamp" style="left:0;right:0;text-align:center;top:1200px;font-size:120px;color:#fff;transform:rotate(-4deg) scale(${1.5-0.5*eo((k-1.9)/.3)})">"DON'T GO"</div>`;
  return h},
record(t,s){const k=t-s.t0;const l2=s.lines[1];const k2=t-l2.t0;let h=glow('#F4C54230','50%','40%');
  h+=`<div class="lab" style="position:absolute;left:0;right:0;text-align:center;top:280px;font-size:30px;color:var(--gold);opacity:${cl(k/.3)}">Most goals in one season</div>`;
  h+=`<div class="card" style="left:60px;width:460px;top:380px;text-align:center;opacity:${cl((k-1.6)/.3)}"><div class="lab">MLS record</div><div class="big" style="font-size:300px">${Math.round(34*eo((k-1.6)/1.2))}</div><div class="lab">Carlos Vela · 2019</div></div>`;
  if(k2>0)h+=`<div class="card" style="right:60px;width:460px;top:380px;text-align:center;border:3px solid var(--gold);box-shadow:0 0 50px #F4C54266;transform:scale(${1.3-0.3*eb(k2/.4)})"><div class="lab">Ronaldo · Saudi record</div><div class="big" style="font-size:300px;color:var(--gold)">${Math.round(35*eo(k2/1.2))}</div><div class="lab">Al Nassr · 2023-24</div></div>`;
  h+=cut('cut_087.png','left:280px;top:900px;height:900px',(k-.2)/.6);
  return h},
end(t,s){const k=t-s.t0;let h=glow('#E31837cc','50%','45%')+beams(t)+sparks(t,34);
  h+=`<img class="cut fade" src="${IMG}ronaldo_tfc_concept.png" style="left:50%;top:560px;height:1000px;transform:translateX(-50%) scale(${1.05+0.05*cl(k/4)});opacity:${cl(k/.3)}">`;
  h+=`<div class="big" style="position:absolute;left:0;right:0;top:230px;text-align:center;font-size:330px;color:var(--gold);opacity:${cl((k-.4)/.2)};transform:scale(${1.6-0.6*eb((k-.4)/.4)});text-shadow:0 0 60px #F4C54288">34?</div>`;
  if(k>2.0)h+=`<div style="position:absolute;left:0;right:0;top:1400px;text-align:center;z-index:30"><div class="big" style="font-size:120px;transform:scale(${1.5-0.5*eb((k-2)/.4)})">WOULD HE<br><span style="color:var(--gold)">BREAK IT?</span></div><div style="margin-top:20px;opacity:${cl((k-2.6)/.3)}"><span class="chip" style="background:var(--red)">COMMENT 👇</span></div></div>`;
  return h}
};
window.renderAt=function(t){
  const sc=scenes.find(s=>t>=s.t0&&t<s.t1)||scenes[scenes.length-1]; const dk=t-sc.t0;
  let h=`<div id="sc">${R[sc.scene](t,sc)}</div>`;
  if(sc.t0>0&&dk<0.12)h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${0.5*(1-dk/.12)};z-index:55"></div>`;
  if(sc.t0>0&&dk<0.5)h+=`<div style="position:absolute;inset:0;z-index:54;background:radial-gradient(ellipse at ${dk*2000-200}px 40%,#ffb34766,transparent 45%);mix-blend-mode:screen"></div>`;
  if(sc.scene!=='end'&&!(sc.scene==='hook'&&t<1.5)){const c=capAt(t); if(c)h+=`<div class="cap"><span class="p">${c}</span></div>`}
  h+=`<div class="prog" style="width:${1080*t/TOTAL}px"></div>`;
  if(!(sc.scene==='hook'&&t>=1.5))h+=`<div class="foot"><span>Photos: Bryan Berlin / Wikimedia Commons (CC BY-SA 4.0)</span><span>TNBALLERS.COM</span></div>`;
  const st=document.getElementById('stage'); st.innerHTML=h;
  // whip transition: blur + slide in, plus shake
  const sc_=document.getElementById('sc'); if(sc.t0>0&&dk<0.3){const p=eo(dk/.3);sc_.style.transform=`translateX(${(1-p)*220}px) scale(${1.08-0.08*p})`;sc_.style.filter=`blur(${(1-p)*18}px)`}
  const sh=sc.t0>0&&dk<0.25?(1-dk/.25)*9:0; st.style.transform=`translate(${sh*Math.sin(t*90)}px,${sh*Math.cos(t*70)}px)`;
};
window.ready=true;
</script></body></html>
