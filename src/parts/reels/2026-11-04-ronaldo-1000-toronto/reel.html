end(t,s){const k=t-s.t0;let h=glow('#E31837cc','50%','45%')+beams(t)+sparks(t,34)+confetti(k+2.5,50);

  h+=`<div style="position:absolute;left:0;right:0;top:170px;text-align:center"><div class="big" style="font-size:200px;color:var(--gold);text-shadow:0 0 50px #F4C54288">1,000</div><div class="big" style="font-size:96px;opacity:${cl((t-wordAt(s.lines[0],'red.')+.2)/.3)}">IN <span style="color:var(--red);text-shadow:0 0 20px #000">RED</span>.</div></div>`;
  const kb_=t-wordAt(s.lines[0],'Would');if(kb_>-.2)h+=`<div style="position:absolute;left:0;right:0;top:1330px;text-align:center;z-index:30"><div class="big" style="font-size:120px;transform:scale(${1.4-0.4*eb((kb_+.2)/.4)});text-shadow:0 10px 40px #000">WOULD YOU<br><span style="color:var(--gold)">BE THERE?</span></div><div style="margin-top:18px;opacity:${cl((kb_-.6)/.3)}"><span class="chip" style="background:var(--red)">TAG A TFC FAN</span></div></div>`;
  return h+tag()}
};
window.renderAt=function(t){
  const sc=scenes.find(s=>t>=s.t0&&t<s.t1)||scenes[scenes.length-1]; const dk=t-sc.t0;
  let h=`<div id="sc">${R[sc.scene](t,sc)}</div>`;
  if(sc.t0>0&&dk<0.45)h+=`<div style="position:absolute;inset:0;z-index:54;background:radial-gradient(ellipse at ${dk*2400-300}px 40%,#ffb34755,transparent 45%);mix-blend-mode:screen"></div>`;

  const sc_=document.getElementById('sc'); if(sc.t0>0&&dk<0.45){const p=eo(dk/.45);sc_.style.opacity=p;sc_.style.transform=`translateY(${(1-p)*90}px) scale(${1.04-0.04*p})`;sc_.style.filter=`blur(${(1-p)*10}px)`}
  // shakes only on big beats
  let sh=0;const S2=window.__beats||[];S2.forEach(b=>{const d=t-b;if(d>=0&&d<.35)sh=Math.max(sh,(1-d/.35)*14)});
