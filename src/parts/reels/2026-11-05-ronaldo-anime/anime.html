<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Tanker;src:url(FONTS/tanker/Tanker-Regular.woff2)}
@font-face{font-family:Switzer;src:url(FONTS/switzer/Switzer-Bold.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#d0102a;--gold:#ffcf5a;--ink:#0d0a0f;--paper:#f3ede2}
body{width:1080px;height:1920px;overflow:hidden;background:#000;font-family:Switzer;color:#fff;position:relative}
#st{position:absolute;inset:0;overflow:hidden}
.L{position:absolute}
.T{font-family:Tanker;line-height:.88;text-transform:uppercase}
.lab{font-family:ui-monospace,Menlo,monospace;letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.panel{position:absolute;overflow:hidden;border:10px solid var(--ink);background:var(--paper);box-shadow:12px 14px 0 #000a}
.panel img{position:absolute;width:100%;height:100%;object-fit:cover}
.tone{position:absolute;inset:0;background-image:radial-gradient(#0003 30%,transparent 32%);background-size:14px 14px}
.grain{position:absolute;inset:0;z-index:90;opacity:.12;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.foot{position:absolute;left:36px;right:36px;bottom:40px;z-index:95;display:flex;justify-content:space-between;font-size:17px;color:#ffffffa0;font-weight:700;letter-spacing:.04em;text-shadow:0 2px 6px #000}
.cap{position:absolute;left:0;right:0;z-index:80;text-align:center}
.cap span{display:inline-block;background:var(--ink);color:#fff;padding:16px 30px 10px;font-family:Tanker;font-size:66px;line-height:1;transform:skewX(-8deg);box-shadow:8px 8px 0 var(--red)}
</style></head><body><div id="st"></div><div class="grain"></div>
<script>
const IMG='IMG/', G3='G3F/';
const TOTAL=58.5, FK=13.7, HD=24.5, FKN=222, HDN=252;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eo=x=>1-Math.pow(1-cl(x),3), eio=x=>{x=cl(x);return x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2};
const eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const rnd=s=>{let v=s;return()=>(v=(v*16807)%2147483647)/2147483647};
const pop=(k,d=.35,s=1.6)=>`transform:scale(${s-(s-1)*eb(k/d)});opacity:${cl(k/.12)}`;
const letters=(txt,k,stag=.05)=>[...txt].map((c,i)=>`<span style="display:inline-block;opacity:${cl((k-i*stag)/.12)};transform:translateY(${(1-eo((k-i*stag)/.3))*70}px) scale(${1+.4*(1-eo((k-i*stag)/.25))})">${c===' '?'&nbsp;':c}</span>`).join('');
// painted anime sky: night or sunset
function sky(t,mode){const r=rnd(7);let h='';
  if(mode==='night'){h+=`<div class="L" style="inset:0;background:linear-gradient(#05061a,#16123d 40%,#3b1f5c 70%,#7a2c5e 88%,#c2496a)"></div>`;
    for(let i=0;i<160;i++){const x=r()*1080,y=r()*1300,s=r()*3+1,tw=.4+.6*Math.abs(Math.sin(t*2+i));h+=`<div class="L" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px;border-radius:50%;background:#fff;opacity:${tw};box-shadow:0 0 ${s*3}px #fff"></div>`}}
  else {h+=`<div class="L" style="inset:0;background:linear-gradient(#2a2a6e,#7b3f8c 30%,#e0607a 52%,#ff9f6b 64%,#ffd08a 74%,#ffe6b8 80%,#7a3b55 81%,#3a1d33)"></div>`;
    h+=`<div class="L" style="left:540px;top:1200px;width:620px;height:620px;margin:-310px;border-radius:50%;background:radial-gradient(#fffbe8,#ffe6a8 40%,#ffb36b00 70%)"></div>`;
    for(let i=0;i<14;i++){const a=-80+i*12+Math.sin(t*.3+i)*2;h+=`<div class="L" style="left:540px;top:1200px;width:10px;height:1400px;transform-origin:top;transform:rotate(${a}deg);background:linear-gradient(#fff6,transparent 70%);opacity:.35;filter:blur(6px)"></div>`}}
  // drifting clouds (flat, layered, anime style)
  for(let i=0;i<7;i++){const y=(mode==='night'?980:880)+i*55+r()*40,w=360+r()*420,x=((r()*1400+t*(18+i*6))%1700)-400;
    h+=`<div class="L" style="left:${x}px;top:${y}px;width:${w}px;height:${46+r()*30}px;border-radius:60px;background:${mode==='night'?'#ff8fb055':'#fff1d9cc'};box-shadow:0 10px 0 ${mode==='night'?'#7a2c5e55':'#f7a07ccc'}"></div>`}
  return h;}
function speed(cx,cy,n,inner,col,op,seed){const r=rnd(seed);let s='';for(let i=0;i<n;i++){const a=r()*360,w=.3+r()*1.2,r0=inner+r()*200;s+=`<div class="L" style="left:${cx}px;top:${cy}px;width:1600px;height:${w*6}px;transform-origin:0 50%;transform:rotate(${a}deg) translateX(${r0}px);background:linear-gradient(90deg,${col},transparent 80%);opacity:${op}"></div>`}return s;}
function petals(t,n,col){const r=rnd(3);let h='';for(let i=0;i<n;i++){const x=(r()*1180+Math.sin(t*.8+i)*60+t*40)%1180-50,y=(r()*2000+t*(70+r()*80))%2000-40,s=10+r()*14;h+=`<div class="L" style="left:${x}px;top:${y}px;width:${s}px;height:${s*.6}px;border-radius:50% 0;background:${col};transform:rotate(${t*90+i*40}deg);opacity:.85"></div>`}return h;}
function confetti(k,n){const r=rnd(11),C=['#ffcf5a','#d0102a','#fff','#0f6b3a'];let h='';for(let i=0;i<n;i++){const a=r(),b=r();const x=540+(a-.5)*1500*eo(k/1.4)+Math.sin(k*3+i)*40,y=-80+k*(300+b*420)-500*Math.max(0,.6-k)*b;h+=`<div class="L" style="left:${x}px;top:${y}px;width:${14+a*10}px;height:${8+b*8}px;background:${C[i%4]};transform:rotate(${k*360*(a-.5)*2+i*37}deg)"></div>`}return h;}
function fireworks(t,seed){const r=rnd(seed);let h='';for(let f=0;f<5;f++){const t0=f*1.2+r()*.6,k=((t-t0)%6+6)%6;if(k>2)continue;const cx=150+r()*780,cy=250+r()*500,col=['#ffcf5a','#ff6b8a','#fff','#7fd4ff'][f%4];
  for(let i=0;i<26;i++){const a=i/26*Math.PI*2,rad=eo(k/1.2)*230;h+=`<div class="L" style="left:${cx+Math.cos(a)*rad}px;top:${cy+Math.sin(a)*rad+k*k*30}px;width:6px;height:6px;border-radius:50%;background:${col};box-shadow:0 0 14px ${col};opacity:${cl(1.6-k)}"></div>`}}return h;}
function frames(dir,k,n){const i=Math.max(1,Math.min(n,1+Math.floor(k*30)));

const SC=[
 [0,3.43,(t)=>{let h=sky(t,'night');const k=t;

   h+=`<img class="L" src="${IMG}m_ronaldo_look.png" style="right:-120px;top:${640+40*(1-eo(k))}px;width:1150px;filter:drop-shadow(14px 14px 0 #000a)">`;
   h+=`<div class="L" style="left:56px;top:190px"><div class="lab" style="font-size:28px;color:#fff">20 August 2003 · first cap</div><div class="T" style="font-size:420px;color:#fff;-webkit-text-stroke:10px var(--ink);paint-order:stroke;${pop(k-.4,.4,1.8)}">18</div><div class="T" style="font-size:90px;color:var(--ink);opacity:${cl((k-.8)/.2)}">YEARS OLD</div></div>`;

   h+=`<div class="L" style="left:56px;top:240px"><div class="lab" style="font-size:28px;color:var(--gold)">World Cup 2018 · Sochi</div><div class="T" style="font-size:120px;margin-top:10px">SPAIN 3–2 PORTUGAL</div></div>`;
   h+=`<div class="L T" style="left:0;right:0;top:1180px;text-align:center;font-size:130px;color:var(--gold);${pop(k-1.3)}">88'</div><div class="L T" style="left:0;right:0;top:1330px;text-align:center;font-size:84px;opacity:${cl((k-1.9)/.2)}">ONE FREE KICK LEFT</div>`;

 [FK,21.1,(t)=>{const k=t-FK;let h=frames('freekick',k,FKN);

   h+=sfx('BOOM!',k-2.455,90,560,-12,210,'#ffcf5a');const g=k-5.54;if(g>0)h+=flash(g)+`<div class="L T" style="left:0;right:0;top:640px;text-align:center;font-size:300px;color:#fff;-webkit-text-stroke:12px var(--red);paint-order:stroke;z-index:20;${pop(g,.3,2)}">3–3</div>`;

 [21.1,HD,(t)=>{const k=t-21.1;let h=`<div class="L" style="inset:0;background:var(--paper)"></div><div class="tone"></div>`+speed(540,900,80,300,'#0d0a0f',.9,9);

   h+=`<div class="L T" style="left:0;right:0;top:820px;text-align:center;font-size:96px;color:var(--ink);opacity:${cl((k-.5)/.2)}">AGAINST SPAIN. AT A WORLD CUP.</div>`;
   for(let i=0;i<3;i++){const kk=k-.9-i*.25;h+=`<div class="L" style="left:${300+i*170}px;top:1020px;width:130px;height:130px;border-radius:50%;background:#fff;border:10px solid var(--ink);${pop(kk,.25,2)}"></div>`}
   return h+inkWipe(k-2.95)}],
 [HD,32.9,(t)=>{const k=t-HD;let h=frames('header',k,HDN);
   h+=`<div class="L" style="left:40px;top:120px;z-index:20"><span class="lab" style="background:var(--red);padding:10px 16px;font-size:24px">LYON · EURO 2016 · SEMI-FINAL</span></div>`;
   const c=k-4.075;if(c>-.6&&c<0)h+=`<div class="cap" style="top:1500px"><span>THE LEAP</span></div>`;
   h+=sfx('WHAM!',k-4.075,120,420,10,220,'#ffcf5a');const g=k-5.825;if(g>0)h+=flash(g)+`<div class="L T" style="left:0;right:0;top:620px;text-align:center;font-size:150px;z-index:20;-webkit-text-stroke:8px var(--ink);paint-order:stroke;${pop(g,.3,2)}">PORTUGAL 1–0<br>WALES</div>`;
   return h}],
 [32.9,36.4,(t)=>{const k=t-32.9;let h=`<div class="L" style="inset:0;background:#0d0a0f"></div>`;
   h+=cutPanel(60,300,960,900,2,'m_ronaldo_look.png','var(--red)','width:130%;height:auto;left:-15%;top:12%;object-fit:contain',k+1,0);
   h+=`<div class="L" style="left:60px;top:1260px"><div class="lab" style="color:var(--gold);font-size:28px">Lyon · 2–0</div><div class="T" style="font-size:150px">INTO THE<br><span style="color:var(--red)">FINAL</span></div></div>`;
   return h+inkWipe(k-3.0)}],
 [36.4,43.3,(t)=>{const k=t-36.4;let h=sky(t,'night')+fireworks(t,4);
   h+=`<div class="L" style="left:540px;top:1100px;width:900px;height:900px;margin:-450px;border-radius:50%;background:radial-gradient(#ffcf5aaa,#ffcf5a00 65%)"></div>`;
   h+=`<img class="L" src="${IMG}ronaldo_look.png" style="left:50%;top:${820+80*(1-eo(k/1.5))}px;width:1250px;transform:translateX(-50%);filter:drop-shadow(0 0 40px #ffcf5a88) saturate(1.2) contrast(1.1)">`;

 [43.3,46.7,(t)=>{const k=t-43.3;let h=`<div class="L" style="inset:0;background:var(--red)"></div>`+speed(540,860,100,240,'#0d0a0f',.8,(t*10|0)+4);

 [46.7,50.1,(t)=>{const k=t-46.7;let h=`<div class="L" style="inset:0;background:var(--paper)"></div><div class="tone"></div>`;

 [50.1,TOTAL+1,(t)=>{const k=t-50.1;let h=sky(t,'sunset')+petals(t,26,'#ffd5e0');

const VO=__VO__;const HITS=[FK+2.455,FK+5.54,HD+4.075,HD+5.825,36.4+3.3];

  let sh=0;HITS.forEach(b=>{const d=t-b;if(d>=0&&d<.4)sh=Math.max(sh,(1-d/.4)*18)});document.getElementById('st').style.transform=`translate(${sh*Math.sin(t*90)}px,${sh*Math.cos(t*73)}px)`;
  h+=`<div class="foot"><span>Photos: Bryan Berlin / Wikimedia Commons (CC BY-SA 4.0) · stylised 3D, based on match reports</span><span>TNBALLERS.COM</span></div>`;
  document.getElementById('st').innerHTML=h;};
window.ready=true;
</script></body></html>
