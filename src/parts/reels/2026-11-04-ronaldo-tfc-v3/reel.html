<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Tanker;src:url(FONTS/tanker/Tanker-Regular.woff2)}
@font-face{font-family:Switzer;src:url(FONTS/switzer/Switzer-Semibold.woff2);font-weight:600}
@font-face{font-family:Switzer;src:url(FONTS/switzer/Switzer-Bold.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E31837;--gold:#F4C542;--pink:#F7A8C8;--ink:#07070a}
body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:Switzer;color:#fff;position:relative}
#stage{position:absolute;inset:0;overflow:hidden} #sc{position:absolute;inset:0}
.bg{position:absolute;inset:0}
.grain{position:absolute;inset:0;opacity:.16;mix-blend-mode:overlay;pointer-events:none;z-index:70;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;z-index:25;pointer-events:none;background:radial-gradient(ellipse 75% 60% at 50% 45%,transparent 50%,#000c 100%)}
.prog{position:absolute;top:0;left:0;height:8px;background:var(--gold);z-index:80}
.cap{position:absolute;left:0;right:0;top:1580px;text-align:center;z-index:60}
.cap span.p{display:inline-block;background:#0b0b10e6;border:2px solid #ffffff1a;padding:18px 30px 14px;border-radius:18px;font-weight:700;font-size:56px;line-height:1.15;max-width:960px;box-shadow:0 20px 50px #000a}
.cap i{font-style:normal;color:var(--gold)}
.foot{position:absolute;left:44px;right:44px;bottom:60px;display:flex;justify-content:space-between;font-size:20px;color:#9a9aa5;font-weight:600;letter-spacing:.05em;z-index:65}
.card{position:absolute;background:#121218ee;border-radius:22px;border:2px solid #ffffff14;box-shadow:0 30px 60px #000b;padding:26px 30px}
.lab{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.16em;color:#b4b4c0;text-transform:uppercase}
.big{font-family:Tanker;line-height:.9}
.cut{position:absolute;filter:drop-shadow(0 30px 50px #000)}
.fade{-webkit-mask-image:linear-gradient(#000 62%,transparent 94%)}
.chip{display:inline-block;font-family:Tanker;font-size:44px;padding:12px 22px 6px;border-radius:12px;margin:8px}
.stamp{position:absolute;font-family:Tanker;color:var(--red);text-shadow:4px 0 #00e5ff99,-4px 0 #ff00aa99}
.photo{position:absolute;inset:0;width:1080px;height:1920px;object-fit:cover}
.shade{position:absolute;inset:0;background:linear-gradient(#000a,#0000 30%,#0000 55%,#000e 85%)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
.beam{position:absolute;top:-300px;width:240px;height:2400px;background:linear-gradient(#ffffff40,transparent 70%);filter:blur(30px);transform-origin:top center}
</style></head><body><div id="stage"></div><div class="vig"></div><div class="grain"></div>
<script>
const S=__SCRIPT__; const TOTAL=__TOTAL__; const G3=__HAS3D__; const IMG='IMG/';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const eo=x=>1-Math.pow(1-cl(x),3); const eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-US'); const cnt=(v,k)=>fmt(v*eo(k));
const scenes=[];S.forEach((l,i)=>{const p=scenes[scenes.length-1]; if(p&&p.scene===l.scene){p.lines.push(l)} else scenes.push({scene:l.scene,t0:i?l.t0-0.1:0,lines:[l]})});
scenes.forEach((s,i)=>s.t1=scenes[i+1]?scenes[i+1].t0:TOTAL);
function capAt(t){
  const i=S.findIndex((x,j)=>t>=x.t0-0.05&&t<(S[j+1]?S[j+1].t0:TOTAL)); if(i<0)return ''; const l=S[i];
  const W=l.show.split(' '); const wts=W.map(w=>Math.max(3,w.replace(/[^\w$%+,.]/g,'').length+(/\d/.test(w)?6:0)));
  const tot=wts.reduce((a,b)=>a+b,0); const d=l.t1-l.t0; let acc=0,cur=0; const p=cl((t-l.t0)/d);
  for(let j=0;j<W.length;j++){acc+=wts[j]/tot; cur=j; if(p<acc)break}
  const chunks=[];let c=[];W.forEach((w,j)=>{c.push(j); if(c.length>=5||/[.?!:]$/.test(w)&&c.length>=2){chunks.push(c);c=[]}}); if(c.length)chunks.push(c);
  const ch=chunks.find(c=>c.includes(cur));
  return ch.map(j=>{const w=W[j];const on=j<=cur;const h=l.hi&&l.hi.includes(w);return `<span style="opacity:${on?1:.18}">${h?`<i>${w}</i>`:w}</span>`}).join(' ');
}
const glow=(c,x='50%',y='40%')=>`<div class="bg" style="background:radial-gradient(ellipse 85% 55% at ${x} ${y},${c} 0%,transparent 70%)"></div>`;
const kb=(src,k,dur,{x0=0,x1=0,y0=0,y1=0,s0=1.08,s1=1.2,f='',pos='50% 50%'}={})=>{const p=cl(k/dur);const sc=s0+(s1-s0)*p;const lim=(sc-1)*540,limy=(sc-1)*960;const cx=v=>Math.max(-lim,Math.min(lim,v)),cy=v=>Math.max(-limy,Math.min(limy,v));return `<img class="photo" src="${IMG}${src}" style="object-position:${pos};transform:translate(${cx(x0+(x1-x0)*p)}px,${cy(y0+(y1-y0)*p)}px) scale(${sc});filter:${f}">`};
const cut=(src,css,k)=>`<img class="cut fade" src="${IMG}${src}" style="${css};opacity:${cl(k*1.6)};transform:translateY(${(1-eo(k))*140}px) scale(${1+0.04*cl(k/4)})">`;

const beams=t=>`<div class="beam" style="left:120px;transform:rotate(${18+3*Math.sin(t)}deg)"></div><div class="beam" style="left:420px;opacity:.8;transform:rotate(${2*Math.sin(t*.7)}deg)"></div><div class="beam" style="left:720px;transform:rotate(${-18-3*Math.sin(t)}deg)"></div>`;

const shirt=(x,y,r,s,o)=>`<svg style="position:absolute;left:${x}px;top:${y}px;transform:rotate(${r}deg) scale(${s});opacity:${o}" width="160" height="150" viewBox="0 0 160 150"><path d="M50 8 L20 22 L2 58 L30 70 L36 52 L36 146 L124 146 L124 52 L130 70 L158 58 L140 22 L110 8 Q80 30 50 8Z" fill="#C8102E" stroke="#7a0a1c" stroke-width="3"/><text x="80" y="118" text-anchor="middle" font-family="Tanker" font-size="62" fill="#fff">7</text></svg>`;

const wordAt=(l,w)=>{const W=l.show.split(' ');const wts=W.map(x=>Math.max(3,x.replace(/[^\w$%+,.]/g,'').length+(/\d/.test(x)?6:0)));const tot=wts.reduce((a,b)=>a+b,0);let acc=0;for(let j=0;j<W.length;j++){if(W[j].startsWith(w))return l.t0+(l.t1-l.t0)*acc;acc+=wts[j]/tot}return l.t0};
const R={
hook(t,s){const l=s.lines[0];const k=t-s.t0;const tb=wordAt(l,'No.');let h='';

form(t,s){const k=t-s.t0;let h=glow('#E31837aa','70%','45%')+beams(t)+sparks(t);

  const kt=t-wordAt(s.lines[0],'title.');if(kt>-.3)h+=`<div style="position:absolute;left:60px;top:900px;z-index:30"><span class="chip" style="background:var(--gold);color:#111;transform:rotate(-3deg) scale(${1.4-0.4*eb((kt+.3)/.35)})">SAUDI CHAMPIONS</span></div>`;

playoffs(t,s){const k=t-s.t0;const l2=s.lines[1];let h=glow('#E3183730','50%','35%');

  h+=`<div style="position:absolute;left:30px;right:30px;top:110px;height:120px;display:flex;align-items:center;gap:20px;font-family:Tanker;font-size:64px;background:#1b1b22;border-radius:14px;padding:0 24px"><span style="color:#888;width:70px">9</span><span style="flex:1">ORLANDO CITY</span><span>43</span></div>`;

  if(up>0.6)h+=`<div style="position:absolute;left:30px;right:30px;top:520px;height:120px;display:flex;align-items:center;gap:20px;font-family:Tanker;font-size:64px;background:#1b1b22;border-radius:14px;padding:0 24px;opacity:${cl((up-.6)/.4)}"><span style="color:#888;width:70px">10</span><span style="flex:1">ORLANDO CITY</span><span>43</span></div>`;
  const kd=t-wordAt(s.lines[0],'12');if(kd>0)h+=`<div style="position:absolute;left:30px;top:680px;right:30px">${Array.from({length:12},(_,i)=>{const w=i<3&&t>wordAt(l2,'wins')+i*.12;return `<span style="display:inline-block;width:62px;height:62px;margin:6px;border-radius:12px;font-family:Tanker;font-size:40px;line-height:68px;text-align:center;background:${w?'var(--gold)':'#2a2a33'};color:${w?'#111':'#aaa'};opacity:${cl((kd-i*.06)/.2)};transform:scale(${w?1.15:1})">${w?'W':'D'}</span>`}).join('')}<div class="lab" style="margin-top:8px">TFC's 12 draws ${t>wordAt(l2,'wins')?'· 3 become wins: +6 pts':''}</div></div>`;

window.renderAt=function(t){
  const sc=scenes.find(s=>t>=s.t0&&t<s.t1)||scenes[scenes.length-1]; const dk=t-sc.t0;
  let h=`<div id="sc">${R[sc.scene](t,sc)}</div>`;
  if(sc.t0>0&&dk<0.12)h+=`<div style="position:absolute;inset:0;background:#fff;opacity:${0.5*(1-dk/.12)};z-index:55"></div>`;
  if(sc.t0>0&&dk<0.5)h+=`<div style="position:absolute;inset:0;z-index:54;background:radial-gradient(ellipse at ${dk*2000-200}px 40%,#ffb34766,transparent 45%);mix-blend-mode:screen"></div>`;
  if(sc.t0>0&&dk<0.22)h+=`<div style="position:absolute;left:-200px;right:-200px;top:${-400+2600*eo(dk/.22)}px;height:260px;background:linear-gradient(90deg,var(--red),var(--gold));transform:rotate(-12deg);z-index:56;opacity:.9"></div>`;
  if(sc.scene!=='end'){const c=capAt(t); if(c)h+=`<div class="cap"><span class="p">${c}</span></div>`}
  h+=`<div class="prog" style="width:${1080*t/TOTAL}px"></div>`;
  h+=`<div class="foot"><span>Photos: Bryan Berlin / Wikimedia Commons (CC BY-SA 4.0) · kit edited</span><span>TNBALLERS.COM</span></div>`;
  const st=document.getElementById('stage'); st.innerHTML=h;
  const sc_=document.getElementById('sc'); if(sc.t0>0&&dk<0.3){const p=eo(dk/.3);sc_.style.transform=`translateX(${(1-p)*220}px) scale(${1.08-0.08*p})`;sc_.style.filter=`blur(${(1-p)*18}px)`}
  const sh=sc.t0>0&&dk<0.25?(1-dk/.25)*9:0; st.style.transform=`translate(${sh*Math.sin(t*90)}px,${sh*Math.cos(t*70)}px)`;
};
