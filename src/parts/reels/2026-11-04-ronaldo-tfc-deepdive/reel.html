<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Tanker;src:url(FONTS/tanker/Tanker-Regular.woff2)}
@font-face{font-family:Switzer;src:url(FONTS/switzer/Switzer-Semibold.woff2);font-weight:600}
@font-face{font-family:Switzer;src:url(FONTS/switzer/Switzer-Bold.woff2);font-weight:700}
*{margin:0;padding:0;box-sizing:border-box}
:root{--red:#E31837;--gold:#F4C542;--pink:#F7A8C8;--ink:#07070a}
body{width:1080px;height:1920px;overflow:hidden;background:var(--ink);font-family:Switzer;color:#fff;position:relative}
#stage{position:absolute;inset:0}
.bg{position:absolute;inset:0}
.grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:overlay;pointer-events:none;z-index:40;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.prog{position:absolute;top:0;left:0;height:8px;background:var(--gold);z-index:50}
.ctitle{position:absolute;left:60px;top:150px;font-family:Tanker;font-size:80px;line-height:1;z-index:30;text-shadow:0 8px 30px #000}
.ctitle b{font-weight:400;color:var(--gold)}
.cap{position:absolute;left:0;right:0;top:1450px;text-align:center;z-index:35}
.cap span.p{display:inline-block;background:#0b0b10e6;border:2px solid #ffffff1a;padding:18px 30px 14px;border-radius:18px;font-weight:700;font-size:54px;line-height:1.15;max-width:960px;box-shadow:0 20px 50px #000a}
.cap i{font-style:normal;color:var(--gold)}
.foot{position:absolute;left:44px;right:44px;bottom:60px;display:flex;justify-content:space-between;font-size:20px;color:#8d8d97;font-weight:600;letter-spacing:.05em;z-index:45}
.card{position:absolute;background:#121218;border-radius:22px;border:2px solid #ffffff14;box-shadow:0 30px 60px #000b;padding:26px 30px}
.lab{font-family:ui-monospace,Menlo,monospace;font-size:22px;letter-spacing:.16em;color:#a6a6b2;text-transform:uppercase}
.big{font-family:Tanker;line-height:.9}
.cut{position:absolute;filter:drop-shadow(0 30px 50px #000)}
.fade{-webkit-mask-image:linear-gradient(#000 62%,transparent 94%)}
.chip{display:inline-block;font-family:Tanker;font-size:40px;padding:12px 20px 6px;border-radius:12px;margin:8px}
.stamp{position:absolute;font-family:Tanker;color:var(--red);text-shadow:4px 0 #00e5ff99,-4px 0 #ff00aa99;transform:rotate(-8deg)}
</style></head><body><div id="stage"></div><div class="grain"></div>
<script>
const S=__SCRIPT__; const TOTAL=__TOTAL__; const HAS3D=__HAS3D__;
const CUT='CUTS/';
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)); const eo=x=>1-Math.pow(1-cl(x),3); const eb=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-US');
// scene spans
const scenes=[];S.forEach((l,i)=>{const p=scenes[scenes.length-1]; if(p&&p.scene===l.scene){p.t1=(S[i+1]?S[i+1].t0:TOTAL);p.lines.push(l)} else scenes.push({scene:l.scene,title:l.title||'',t0:i?l.t0-0.05:0,t1:(S[i+1]?S[i+1].t0:TOTAL),lines:[l]})});
scenes[scenes.length-1].t1=TOTAL;
// chapter title persists until next titled line
function chapterAt(t){let c='';for(const l of S){if(l.t0-0.05>t)break; if(l.title!==undefined)c=l.title; if(['hook','question','series','end'].includes(l.scene))c=l.title||''}return c}
function capAt(t){
  const l=S.find((x,i)=>t>=x.t0-0.05&&t<(S[i+1]?S[i+1].t0:TOTAL)); if(!l)return '';
  const W=l.show.split(' '); const wts=W.map(w=>Math.max(3,w.replace(/[^\w$%+,.]/g,'').length+(/\d/.test(w)?6:0)));
  const tot=wts.reduce((a,b)=>a+b,0); const d=l.t1-l.t0; let acc=0,cur=0;
  const p=cl((t-l.t0)/d); for(let i=0;i<W.length;i++){acc+=wts[i]/tot; if(p<acc){cur=i;break} cur=i}
  // chunk of up to 5 words containing cur, break chunks at punctuation
  const chunks=[];let c=[];W.forEach((w,i)=>{c.push(i); if(c.length>=5||/[.?!:]$/.test(w)&&c.length>=2){chunks.push(c);c=[]}}); if(c.length)chunks.push(c);
  const ch=chunks.find(c=>c.includes(cur));
  return ch.map(i=>{const w=W[i];const on=i<=cur;const h=l.hi&&l.hi.includes(w);return `<span style="opacity:${on?1:.18}">${h?`<i>${w}</i>`:w}</span>`}).join(' ');
}
function glow(c,x='50%',y='40%'){return `<div class="bg" style="background:radial-gradient(ellipse 85% 55% at ${x} ${y},${c} 0%,transparent 70%)"></div>`}
function cutImg(src,css,k){return `<img class="cut fade" src="${CUT}${src}.png" style="${css};opacity:${cl(k*1.5)};transform:translateY(${(1-eo(k))*120}px) scale(${1+0.03*k})">`}
function counter(v,k){return fmt(v*eo(k))}
const R={
hook(t,s){let h='';
  if(HAS3D){const f=Math.min(Math.floor((t)*30)+1,240);const z=t>8?1+(t-8)*0.04:1;h+=`<img src="G3/${String(f).padStart(4,'0')}.jpg" style="position:absolute;inset:0;width:1080px;height:1920px;transform:scale(${z})">`}
  else{h+=glow('#1aa59a99')+cutImg('ronaldo','right:-40px;top:380px;height:1050px',(t-s.t0)/.6)}
  const l2=S[1]; if(t>l2.t0){const k=(t-l2.t0)/.4;h+=`<div class="card" style="left:60px;top:330px;width:620px;opacity:${cl(k)};transform:translateY(${(1-eo(k))*40}px) rotate(-2deg);z-index:31"><div class="lab">@champagnepapi · 3 Jul 2026</div><div style="font-weight:700;font-size:44px;margin-top:10px">"We are the same height I swear, vamos!!! My brother @cristiano"</div></div>`}
  return h},
question(t,s){const k=(t-s.t0)/.5;return glow('#E3183755','25%','45%')+glow('#F7A8C855','75%','45%')+
  cutImg('ronaldo','left:-60px;top:430px;height:960px',k)+cutImg('messi','right:-60px;top:430px;height:960px',k-0.3)+
  `<div class="big" style="position:absolute;left:0;right:0;top:250px;text-align:center;font-size:150px;z-index:20;opacity:${cl(k)}">RONALDO <span style="color:var(--gold);font-size:90px">vs</span> MESSI</div>`+
  `<div style="position:absolute;left:60px;top:1240px;z-index:31;opacity:${cl(k-.5)}"><span class="chip" style="background:var(--red)">TORONTO FC?</span></div><div style="position:absolute;right:60px;top:1240px;z-index:31;opacity:${cl(k-.8)}"><span class="chip" style="background:var(--pink);color:#111">INTER MIAMI</span></div>`},

  return glow('#F4C54233')+`<div style="position:absolute;left:0;right:0;top:470px;text-align:center"><div class="lab" style="color:var(--gold);font-size:28px;opacity:${cl(k/.3)}">TNB · WHAT IF · DEEP DIVE</div><div class="big" style="font-size:190px;margin-top:20px;transform:scale(${1.6-0.6*eo(k/.4)});opacity:${cl(k/.3)}">RONALDO<br><span style="color:var(--red)">AT TFC</span></div></div>`+

bar(t,s){const k=t-s.t0;const l2=s.lines[1];const k2=t-l2.t0;let h=glow('#F7A8C844','70%','40%')+cutImg('messi','right:-120px;top:330px;height:900px;filter:brightness(.55)',k/.6);

  const k3=k2-2.6; if(k3>0){h+=`<div class="card" style="left:60px;right:60px;top:1080px;opacity:${cl(k3/.3)}"><div class="lab">Inter Miami revenue</div><div style="display:flex;align-items:flex-end;gap:30px;margin-top:14px;height:150px"><div style="width:180px;height:${42*eo(k3)}px;background:#555"></div><div style="width:180px;height:${150*eo((k3-.4)/.8)}px;background:var(--pink)"></div><div class="big" style="font-size:96px">$${counter(56,k3/.3)}M → <span style="color:var(--pink)">$${counter(200,(k3-.4)/1)}M</span></div></div><div class="lab" style="margin-top:8px">2022 → 2025 · ~100 goals in 115 games</div></div>`}

scout(t,s){const k=t-s.t0;let h=glow('#E3183744','30%','40%')+cutImg('ronaldo','left:-80px;top:360px;height:1000px',k/.6);

   if(k2>3.0){const kz=(k2-3)/.35;h+=`<div class="card" style="left:560px;top:330px;width:460px;z-index:32;opacity:${cl(kz)};transform:scale(${1.3-0.3*eo(kz)})"><div class="lab">Zlatan · LA Galaxy 2018-19</div><div class="big" style="font-size:120px;color:var(--gold)">53 <span style="font-size:60px;color:#fff">in</span> 58</div><div class="lab">MLS games, aged 36-38</div></div>`}}

owner(t,s){const k=t-s.t0;let h=glow('#F4C54222','50%','30%');const l2o=s.lines[1]; if(t<l2o.t0+0.3){h+=cutImg('ronaldo','left:50%;margin-left:-380px;top:640px;height:820px;filter:brightness(.8)',Math.min(k/.6,(l2o.t0+0.3-t)/.3))}

  const ev=[['JUN 2027','Al Nassr deal ends',80,0.6],['JUL 2027','MLS 2027-28 kicks off',560,2.6]];
  ev.forEach(e=>{const kk=(k-e[3])/.35;h+=`<div style="position:absolute;left:${e[2]}px;top:330px;width:440px;opacity:${cl(kk)}"><div class="big" style="font-size:84px;color:var(--gold)">${e[0]}</div><div style="width:28px;height:28px;border-radius:50%;background:var(--gold);margin:22px 0 18px;box-shadow:0 0 30px var(--gold)"></div><div style="font-weight:700;font-size:34px">${e[1]}</div></div>`});
  const l2=s.lines[1];const k2=t-l2.t0; if(k2>-0.2){
   const dp=[['SARGENT','DP 1'],['MIHAILOVIC','DP 2'],['?','DP 3 · OPEN']];
   h+=`<div style="position:absolute;left:60px;right:60px;top:690px;display:flex;gap:20px">${dp.map((d,i)=>{const kk=(k2-i*.3)/.3;const op=i==2;return `<div class="card" style="position:relative;flex:1;padding:22px;opacity:${cl(kk)};border:${op?'3px dashed var(--gold)':'2px solid #ffffff14'};box-shadow:${op&&k2>1?'0 0 '+(30+20*Math.sin(t*6))+'px #F4C54288':'none'}"><div class="lab">${d[1]}</div><div class="big" style="font-size:${op?110:56}px;color:${op?'var(--gold)':'#fff'};margin-top:8px">${d[0]}</div></div>`}).join('')}</div>`;
   const kc=(k2-2.2);if(kc>0)h+=`<div class="card" style="left:60px;right:60px;top:940px"><div class="lab">His salary-cap charge (max DP, 2026 rules)</div><div class="big" style="font-size:150px;color:var(--gold)">$${counter(803125,kc/1.2)}</div></div>`;
   const kd=k2-5.2; if(kd>0){h+=`<div style="position:absolute;left:40px;right:40px;top:1180px;text-align:center;z-index:31">${['SALARY','REVENUE SHARE','EQUITY'].map((x,i)=>`<span class="chip" style="background:${i==2?'var(--gold)':'#24242c'};color:${i==2?'#111':'#fff'};opacity:${cl((kd-i*.4)/.3)};transform:scale(${1.4-0.4*eo((kd-i*.4)/.3)})">${x}</span>`).join('')}</div>`}}
  return h},
manager(t,s){const k=t-s.t0;let h='';
  // pitch
  h+=`<div style="position:absolute;left:90px;top:300px;width:900px;height:1020px;border:4px solid #ffffff30;border-radius:10px;background:linear-gradient(#0d3a1e,#0a2a16);opacity:${cl(k/.4)}"><div style="position:absolute;left:0;right:0;top:50%;border-top:4px solid #ffffff30"></div><div style="position:absolute;left:300px;width:300px;top:0;height:160px;border:4px solid #ffffff30;border-top:none"></div><div style="position:absolute;left:300px;width:300px;bottom:0;height:160px;border:4px solid #ffffff30;border-bottom:none"></div><div style="position:absolute;left:350px;top:410px;width:200px;height:200px;border:4px solid #ffffff30;border-radius:50%"></div></div>`;
  const kc=k-0.6; if(kc>0&&kc<4.6){const o=kc<4.2?1:cl((4.6-kc)/.4);h+=`<div class="card" style="left:240px;right:240px;top:640px;text-align:center;z-index:31;opacity:${o};transform:scale(${1.4-0.4*eb(kc/.4)})"><div class="lab">Goals conceded 2026</div><div class="big" style="font-size:230px;color:var(--red)">${counter(63,kc/1.2)}</div><div class="lab">TFC · 33 games</div></div>`}

marketer(t,s){const k=t-s.t0;let h=glow('#E3183733','50%','45%');

  <div style="position:absolute;left:60px;right:60px;bottom:40px;display:flex;align-items:flex-end;gap:80px;height:720px">

verdict(t,s){const k=t-s.t0;const l2=s.lines[1];const k2=t-l2.t0;let h=glow('#F4C54233','50%','35%');

  h+=row(330,'On trophies','MESSI','var(--pink)',(k-1.2)/.35,'messi');
  h+=`<div class="card" style="left:60px;right:60px;top:670px;display:flex;justify-content:space-around;opacity:${cl((k-3)/.3)}"><div style="text-align:center"><div class="lab">Messi on arrival</div><div class="big" style="font-size:120px;color:var(--pink)">36</div></div><div style="text-align:center"><div class="lab">Ronaldo in 2027</div><div class="big" style="font-size:120px;color:var(--red)">42</div></div></div>`;
  if(k2>0)h+=row(1010,'Off the pitch','RONALDO','var(--red)',k2/.35,'ronaldo');
  return h},
end(t,s){const k=t-s.t0;return glow('#E3183777','50%','45%')+cutImg('ronaldo_tfc_concept','left:50%;margin-left:-430px;top:420px;height:1000px',k/.5)+
  `<div style="position:absolute;left:0;right:0;top:250px;text-align:center;z-index:31"><div class="big" style="font-size:150px;transform:scale(${1.5-0.5*eb(k/.4)});opacity:${cl(k/.2)}">WOULD YOU<br><span style="color:var(--gold)">BUY A TICKET?</span></div></div>`+
  `<div style="position:absolute;left:0;right:0;top:1290px;text-align:center;z-index:31;opacity:${cl((k-.6)/.3)}"><span class="chip" style="background:var(--red)">COMMENT 👇</span><div class="lab" style="margin-top:14px">Fan concept · kit edited by TNB</div></div>`}
};
// hold end card for extra seconds
window.renderAt=function(t){
  const sc=scenes.find(s=>t>=s.t0&&t<s.t1)||scenes[scenes.length-1];
  let h=R[sc.scene](t,sc);
  // cut flash + slab wipe at every scene start
  const dk=t-sc.t0; if(sc.t0>0&&dk<0.35){h+=`<div style="position:absolute;inset:-200px;background:linear-gradient(115deg,transparent 40%,var(--red) 40%,var(--red) 55%,var(--gold) 55%,var(--gold) 58%,transparent 58%);transform:translateX(${-1400+2800*eo(dk/.35)}px);z-index:60"></div><div style="position:absolute;inset:0;background:#fff;opacity:${0.25*(1-dk/.2)};z-index:59"></div>`}
  const ct=chapterAt(t); if(ct&&sc.scene!=='hook')h+=`<div class="ctitle">${ct}</div>`;
  if(sc.scene!=='end'&&!(sc.scene==='hook'&&HAS3D&&t<1.3)){const c=capAt(t); if(c)h+=`<div class="cap"><span class="p">${c}</span></div>`}
  h+=`<div class="prog" style="width:${1080*t/TOTAL}px"></div>`;
  if(!(sc.scene==='hook'&&HAS3D))h+=`<div class="foot"><span>${''}Photos: Bryan Berlin / Wikimedia Commons (CC BY-SA 4.0)</span><span>TNBALLERS.COM</span></div>`;
  // shake on scene start
  const sh=sc.t0>0&&dk<0.25?(1-dk/.25)*10:0; document.getElementById('stage').style.transform=`translate(${sh*Math.sin(t*90)}px,${sh*Math.cos(t*70)}px)`;
  document.getElementById('stage').innerHTML=h;
};
window.ready=true;
</script></body></html>
