<!doctype html>
<!-- TNB "player hero" result post v2. Rendered by src/tools/hero_post.py: 1080x1350 still (feed) and 1080x1920 animated Reel.
     Baller, 31 Oct 2026: the player must dominate the post; people stay for the player. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tanker;src:url(%%FONTS%%/tanker/Tanker-Regular.woff2) format('woff2')}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Semibold.woff2) format('woff2');font-weight:600}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Bold.woff2) format('woff2');font-weight:700}
:root{--red:#d40f1f;--red2:#8a0712;--gold:#f0c255;--gold2:#b8862b;--club:%%CLUB%%;--home:%%HOMEC%%;--away:%%AWAYC%%;--H:%%VH%%px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:var(--H);overflow:hidden;background:#050506}
.post{position:relative;width:1080px;height:var(--H);overflow:hidden;font-family:Switzer,sans-serif;color:#fff;
  background:
   radial-gradient(900px 1000px at 72% 38%, color-mix(in srgb,var(--club) 78%,transparent), transparent 70%),
   radial-gradient(700px 500px at 0% 100%, rgba(240,194,85,.10), transparent 70%),
   linear-gradient(180deg,#151517 0%,#0a0a0b 55%,#050506 100%)}
/* light beams from top right */
.beams{position:absolute;inset:0;mix-blend-mode:screen;opacity:.55;
  background:
   linear-gradient(115deg,transparent 46%,rgba(255,255,255,.10) 49%,transparent 53%),
   linear-gradient(115deg,transparent 58%,rgba(255,255,255,.06) 60%,transparent 63%),
   linear-gradient(115deg,transparent 66%,color-mix(in srgb,var(--club) 60%,transparent) 68%,transparent 72%)}
/* halftone dots */
.dots{position:absolute;right:-60px;top:120px;width:620px;height:620px;opacity:.22;
  background-image:radial-gradient(circle,rgba(255,255,255,.9) 1.6px,transparent 2px);background-size:16px 16px;
  -webkit-mask-image:radial-gradient(closest-side,#000,transparent)}
.stripe{position:absolute;width:150px;height:3000px;background:linear-gradient(180deg,var(--red),var(--red2));transform:rotate(28deg);top:-700px;left:900px;opacity:.9}
.stripe.thin{width:12px;left:1075px;background:var(--gold);opacity:.75}
.grain{position:absolute;inset:0;opacity:.13;mix-blend-mode:overlay;pointer-events:none;z-index:20;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
.vig{position:absolute;inset:0;pointer-events:none;z-index:19;background:radial-gradient(130% 90% at 55% 40%,transparent 55%,rgba(0,0,0,.55) 100%)}
/* giant surname behind the player */
.ghost{position:absolute;top:var(--ghostTop);left:0;right:0;text-align:center;font-family:Tanker;font-size:%%GHOSTSIZE%%px;line-height:.8;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 90%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ghost2{position:absolute;top:calc(var(--ghostTop) + %%GHOSTSIZE%%px * .8 + 6px);left:0;right:0;text-align:center;font-family:Tanker;font-size:%%GHOSTSIZE%%px;line-height:.8;text-transform:uppercase;white-space:nowrap;
  color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.10)}
/* echo: a big faint copy of the player for depth */
.echo{position:absolute;left:calc(%%PX%%px - 260px);bottom:var(--pBottom);width:calc(%%PW%%px * 1.25);opacity:.16;filter:grayscale(1) contrast(1.2) blur(1px);
  -webkit-mask-image:linear-gradient(180deg,#000 40%,transparent 80%)}
.echo img{width:100%;display:block}
/* the player, with a club-colour rim light */
.player{position:absolute;left:%%PX%%px;bottom:var(--pBottom);width:%%PW%%px;z-index:3;
  filter:drop-shadow(-6px 0 0 color-mix(in srgb,var(--club) 70%,white 10%)) drop-shadow(-18px -4px 26px color-mix(in srgb,var(--club) 90%,transparent)) drop-shadow(0 30px 60px rgba(0,0,0,.7));
  -webkit-mask-image:linear-gradient(180deg,#000 68%,transparent 96%),linear-gradient(90deg,transparent 0%,#000 14%,#000 92%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.player img{width:100%;display:block}
/* header */
.kicker{position:absolute;top:var(--headTop);left:56px;font-weight:700;font-size:22px;letter-spacing:.3em;color:var(--gold);display:flex;align-items:center;gap:14px;text-transform:uppercase;z-index:6}
.kicker i{display:block;width:44px;height:3px;background:var(--gold)}
.ft{position:absolute;top:calc(var(--headTop) - 10px);right:56px;background:var(--red);font-weight:700;font-size:22px;letter-spacing:.24em;padding:10px 18px 9px;z-index:6;
  box-shadow:0 10px 30px rgba(212,15,31,.45)}
/* player name block */
.who{position:absolute;left:56px;top:var(--whoTop);width:560px;z-index:6}
.flag{font-weight:700;font-size:20px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;display:flex;align-items:center;gap:12px}
.flag:before{content:"";width:28px;height:3px;background:var(--gold)}
.name{font-family:Tanker;font-size:%%NAMESIZE%%px;line-height:.84;text-transform:uppercase;margin-top:12px;text-shadow:0 10px 40px rgba(0,0,0,.8)}
.name .f{display:block;color:transparent;-webkit-text-stroke:2.5px #fff}
.name .l{display:block}
.tag{display:inline-block;margin-top:20px;background:linear-gradient(90deg,var(--gold),#ffd77e);color:#111;font-weight:700;font-size:20px;letter-spacing:.16em;padding:10px 16px 9px;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,calc(100% - 14px) 100%,0 100%)}
/* scoreboard */
.board{position:absolute;left:0;right:0;bottom:0;height:var(--boardH);z-index:8;
  background:linear-gradient(180deg,rgba(5,5,6,0) 0%,rgba(5,5,6,.88) 28%,#050506 55%)}
.plate{position:absolute;left:50%;top:var(--rowTop);transform:translateX(-50%);width:360px;height:200px;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:2px solid var(--gold);border-radius:22px;
  box-shadow:0 0 0 6px rgba(240,194,85,.08),0 20px 60px rgba(0,0,0,.6)}
.score{position:absolute;left:0;right:0;top:calc(var(--rowTop) + 14px);text-align:center;font-family:Tanker;font-size:190px;line-height:.9;letter-spacing:.02em}
.team{position:absolute;top:calc(var(--rowTop) + 62px);width:330px;font-family:Tanker;font-size:56px;line-height:.9;text-transform:uppercase;text-align:center}
.team.h{left:28px} .team.a{right:28px}
.team i{display:block;margin:14px auto 0;width:110px;height:6px;border-radius:3px}
.team.h i{background:var(--home)} .team.a i{background:var(--away)}
.team.dim{color:#8a8a8a}
.sc{position:absolute;top:calc(var(--rowTop) + 160px);width:330px;font-weight:700;font-size:22px;line-height:1.5;text-align:center;color:#eaeaea;letter-spacing:.06em;text-transform:uppercase}
.sc.h{left:28px} .sc.a{right:28px}
.ctx{position:absolute;left:56px;right:56px;top:calc(var(--rowTop) + 252px);text-align:center;font-size:24px;font-weight:600;color:#cfcfcf}
.foot{position:absolute;left:44px;right:44px;bottom:26px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(240,194,85,.7);padding-top:14px;z-index:9}
.foot .c{font-size:15px;font-weight:600;color:#9d9d9d;letter-spacing:.04em}
.foot .r{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.24em}
.foot .r img{width:38px;height:40px}
/* layout variables: feed 4:5 and reel 9:16 */
.post{--ghostTop:110px;--headTop:54px;--whoTop:330px;--pBottom:250px;--boardH:470px;--rowTop:60px}
.post.reel{--ghostTop:260px;--headTop:150px;--whoTop:600px;--pBottom:560px;--boardH:720px;--rowTop:170px}
.post.reel .player{width:calc(%%PW%%px * 1.18);left:calc(%%PX%%px - 120px)}
.post.reel .foot{bottom:150px}
.post.reel .echo{opacity:.09}
/* animation (paused and stepped frame by frame by hero_post.py) */
@keyframes slideL{from{transform:translateX(-160px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(160px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(220px) scale(.94);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(140px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1.9);opacity:0;filter:blur(8px)}65%{transform:scale(.94);opacity:1;filter:none}100%{transform:scale(1)}}
@keyframes plate{0%{transform:translateX(-50%) scale(.6);opacity:0}100%{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@keyframes sweep{from{background-position:-1200px 0}to{background-position:1200px 0}}
/* HOOK FIRST (Baller, 31 Oct 2026): frame 0 already shows the player's face, the name and the score.
   Nothing starts invisible except the small details; the motion is a punch-in, a flash and a slow push. */
@keyframes punch{0%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes flash{0%{opacity:.35}100%{opacity:0}}
@keyframes thump{0%{transform:scale(1.25)}60%{transform:scale(.96)}100%{transform:scale(1)}}
@keyframes nudgeL{from{transform:translateX(-40px)}to{transform:none}}
@keyframes nudgeR{from{transform:translateX(40px)}to{transform:none}}
.flashl{position:absolute;inset:0;background:#fff;z-index:30;opacity:0;pointer-events:none}
.anim .flashl{animation:flash .25s ease-out 0s both}
.anim .player{animation:punch .7s cubic-bezier(.2,.9,.2,1) 0s both, push 7s linear .7s both;transform-origin:50% 100%}
.anim .ghost,.anim .ghost2{animation:nudgeR .8s ease-out 0s both, drift 7.5s linear .8s both}
.anim .echo{animation:fade 1s .2s both}
.anim .beams{animation:fade .8s 0s both}
.anim .who{animation:nudgeL .6s cubic-bezier(.2,.8,.2,1) 0s both}
.anim .score{animation:thump .55s ease-out .05s both}
.anim .plate{animation:none}
.anim .team.h{animation:nudgeL .5s ease-out .1s both}
.anim .team.a{animation:nudgeR .5s ease-out .1s both}
.anim .sc{animation:fade .5s .5s both}
.anim .ctx{animation:fade .5s .9s both}
</style></head>
<body class="%%ANIM%%">%%BODY%%</body></html>
