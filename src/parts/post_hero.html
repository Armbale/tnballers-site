<!doctype html>
<!-- TNB "player hero" result post. Rendered by src/tools/hero_post.py (1080x1350 still + 1080x1920 animated Reel).
     Baller, 31 Oct 2026: the player must dominate the post; people stay for the player. -->
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Tanker;src:url(%%FONTS%%/tanker/Tanker-Regular.woff2) format('woff2')}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Regular.woff2) format('woff2');font-weight:400}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Semibold.woff2) format('woff2');font-weight:600}
@font-face{font-family:Switzer;src:url(%%FONTS%%/switzer/Switzer-Bold.woff2) format('woff2');font-weight:700}
:root{--red:#d40f1f;--red2:#8a0712;--gold:#f0c255;--ink:#0a0a0b;--club:%%CLUB%%;--home:%%HOMEC%%;--away:%%AWAYC%%}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:%%VW%%px;height:%%VH%%px;overflow:hidden;background:#070708}
body{display:flex;align-items:center;justify-content:center;
  background:radial-gradient(900px 900px at 60% 40%, color-mix(in srgb,var(--club) 45%,transparent), transparent 70%),#070708}
.post{position:relative;width:1080px;height:1350px;overflow:hidden;font-family:Switzer,sans-serif;color:#fff;
  background:
   radial-gradient(760px 820px at 700px 520px, color-mix(in srgb,var(--club) 70%,transparent), transparent 72%),
   radial-gradient(600px 400px at 120px 1300px, rgba(240,194,85,.10), transparent 70%),
   linear-gradient(180deg,#141416 0%,#0b0b0c 55%,#060607 100%)}
.stripe{position:absolute;width:170px;height:2300px;background:linear-gradient(180deg,var(--red),var(--red2));transform:rotate(28deg);top:-480px;left:880px;opacity:.85}
.stripe.thin{width:14px;left:1060px;background:var(--gold);opacity:.7}
.grain{position:absolute;inset:0;opacity:.12;mix-blend-mode:overlay;pointer-events:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>")}
/* giant surname behind the player */
.ghost{position:absolute;top:96px;left:-20px;right:-20px;text-align:center;font-family:Tanker;font-size:%%GHOSTSIZE%%px;line-height:.8;text-transform:uppercase;
  color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.16);white-space:nowrap;letter-spacing:.01em}
/* the player */
.player{position:absolute;left:%%PX%%px;top:%%PY%%px;width:%%PW%%px;filter:drop-shadow(0 30px 60px rgba(0,0,0,.65));
  -webkit-mask-image:linear-gradient(180deg,#000 62%,transparent 92%),linear-gradient(90deg,transparent 0%,#000 16%,#000 90%,transparent 100%);-webkit-mask-composite:source-in;mask-composite:intersect}
.player img{width:100%;display:block}
.rim{position:absolute;left:%%PX%%px;top:%%PY%%px;width:%%PW%%px;height:1100px;
  background:radial-gradient(closest-side,color-mix(in srgb,var(--club) 55%,transparent),transparent);opacity:.55;filter:blur(30px)}
/* header */
.kicker{position:absolute;top:52px;left:56px;font-weight:700;font-size:22px;letter-spacing:.3em;color:var(--gold);display:flex;align-items:center;gap:14px;text-transform:uppercase}
.kicker i{display:block;width:44px;height:3px;background:var(--gold)}
.ft{position:absolute;top:44px;right:56px;background:var(--red);font-weight:700;font-size:22px;letter-spacing:.24em;padding:10px 18px 9px}
/* player name block */
.who{position:absolute;left:56px;top:%%WHOTOP%%px;width:520px;z-index:4}
.flag{font-weight:700;font-size:20px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase}
.name{font-family:Tanker;font-size:%%NAMESIZE%%px;line-height:.84;text-transform:uppercase;margin-top:10px;text-shadow:0 8px 40px rgba(0,0,0,.75)}
.name span{display:block}
.tag{display:inline-block;margin-top:18px;background:var(--gold);color:#111;font-weight:700;font-size:20px;letter-spacing:.16em;padding:9px 14px 8px;text-transform:uppercase}
/* scoreboard */
.board{position:absolute;left:0;right:0;bottom:0;height:470px;z-index:5;
  background:linear-gradient(180deg,rgba(6,6,7,0) 0%,rgba(6,6,7,.86) 26%,#060607 52%)}
.row{position:absolute;left:40px;right:40px;top:150px;display:grid;grid-template-columns:1fr 330px 1fr;align-items:center}
.team{font-family:Tanker;font-size:58px;line-height:.9;text-transform:uppercase;text-align:center;padding-bottom:12px;position:relative}
.team:after{content:"";position:absolute;left:50%;bottom:0;width:120px;height:6px;transform:translateX(-50%)}
.team.h:after{background:var(--home)} .team.a:after{background:var(--away)}
.team.dim{color:#8d8d8d}
.score{font-family:Tanker;font-size:190px;line-height:.82;text-align:center;letter-spacing:.02em;text-shadow:0 0 50px rgba(0,0,0,.6)}
.scorers{position:absolute;left:40px;right:40px;top:262px;display:grid;grid-template-columns:1fr 330px 1fr}
.sc{font-weight:600;font-size:23px;line-height:1.45;text-align:center;color:#e8e8e8;letter-spacing:.04em;text-transform:uppercase}
.ctx{position:absolute;left:56px;right:56px;top:%%CTXTOP%%px;text-align:center;font-size:24px;font-weight:600;color:#cfcfcf}
.foot{position:absolute;left:44px;right:44px;bottom:26px;display:flex;align-items:center;justify-content:space-between;border-top:2px solid rgba(240,194,85,.7);padding-top:14px;z-index:6}
.foot .c{font-size:15px;font-weight:600;color:#9d9d9d;letter-spacing:.04em}
.foot .r{display:flex;align-items:center;gap:12px;font-weight:700;font-size:19px;letter-spacing:.24em}
.foot .r img{width:38px;height:40px}
/* animation (paused and stepped by hero_post.py for the Reel) */
@keyframes slideL{from{transform:translateX(-140px);opacity:0}to{transform:none;opacity:1}}
@keyframes rise{from{transform:translateY(160px) scale(.96);opacity:0}to{transform:none;opacity:1}}
@keyframes drop{from{transform:translateY(-40px);opacity:0}to{transform:none;opacity:1}}
@keyframes up{from{transform:translateY(120px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{0%{transform:scale(1.8);opacity:0}70%{transform:scale(.95);opacity:1}100%{transform:scale(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.045)}}
.anim .ghost{animation:slideL .9s cubic-bezier(.2,.8,.2,1) .1s both}
.anim .player,.anim .rim{animation:rise 1.1s cubic-bezier(.2,.9,.2,1) .25s both, push 6.5s linear 1.4s both}
.anim .rim{animation:fade 1.2s .4s both}
.anim .kicker,.anim .ft{animation:drop .5s ease-out 0s both}
.anim .who{animation:slideL .7s cubic-bezier(.2,.8,.2,1) 1.0s both}
.anim .board{animation:up .6s cubic-bezier(.2,.8,.2,1) 1.7s both}
.anim .score{animation:pop .5s ease-out 2.15s both}
.anim .scorers{animation:fade .6s 2.6s both}
.anim .ctx{animation:fade .6s 3.1s both}
</style></head>
<body class="%%ANIM%%">%%BODY%%</body></html>
